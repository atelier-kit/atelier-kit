modes:
  quick:
    description: Small, low-risk change. Research lives inline in plan.md.
    required_artifacts:
      - plan.md
      - review.md
    plan_sections:
      research_notes: required
    max_recommended_slices: 3

  standard:
    description: Normal feature or medium change. One consolidated research artifact.
    required_artifacts:
      - research.md
      - plan.md
      - review.md
    research_sections:
      questions: required
      codebase: required
      constraints: required
      what_exists_vs_created: required
      open_unknowns: required
      product_behavior: optional
    optional_artifacts:
      - design.md

  deep:
    description: High-risk architectural or product change.
    required_artifacts:
      - research.md
      - design.md
      - plan.md
      - review.md
    research_sections:
      questions: required
      codebase: required
      constraints: required
      product_behavior: required
      what_exists_vs_created: required
      open_unknowns: required
    design_sections:
      decisions: required
      risk_register: required
      rollback: required
      test_strategy: required
